[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-clipflow"
version = "0.4.2"
description = "Two-stage reference-video segmentation, numbered watermark, SRT, and graded reassembly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "opencv-python-headless>=4.6", "scipy>=1.9"]
license = {file = "LICENSE"}

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
test = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110"]
cloud-server = ["faster-whisper>=1.1", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
clipflow = "clipflow.cli:main"

[tool.setuptools.packages.find]
include = ["clipflow*"]
