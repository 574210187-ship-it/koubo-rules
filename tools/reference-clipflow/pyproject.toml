[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipflow-visual"
version = "0.6.0"
description = "Visual-only, evidence-gated video splitting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
clipflow-visual = "clipflow.cli:main"

[tool.setuptools]
packages = ["clipflow"]
